<html lang="ru"><head><meta charset="utf-8">

<style>

:root[data-theme=dark]{--bg:#0f171d;--pn:#17232b;--ink:#e3eaef;--mut:#8da0ad;--ln:#2a3a46;--ac:#5aa9f0;--on:#08141c;--st:#1b2a34;color-scheme:dark}

#home{max-width:720px;margin:0 auto;padding:32px 20px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}h2{font-size:16px;margin:28px 0 8px}
.drop{display:block;border:1.5px dashed var(--ln);border-radius:12px;padding:28px;text-align:center;cursor:pointer;background:var(--pn)}
.drop:hover,.drop.on{border-color:var(--ac)}
#ml{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--ln);border-radius:10px;background:var(--pn)}
#ml li{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--ln);flex-wrap:wrap}#ml li:first-child{border:0}
#ml .n{flex:1;min-width:140px}#ml b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bar button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.bar #cm.has{background:#d93025;border-color:#d93025;color:#fff}

<script>
const $=s=>document.querySelector(s),C=window.claude;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const cap=async n=>{try{return C?await C.use(n):null}catch(e){return null}};
const b64=a=>{let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const unb64=t=>{const s=atob(t.trim()),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer};
const fmt=n=>n>1e6?(n/1e6).toFixed(1)+' МБ':Math.round(n/1e3)+' КБ';
const TD=new TextDecoder('utf-16le');

/* ---- разбор контейнера BZ85: словарь имён + дерево узлов, основной блок сжат zlib ---- */
function dict(S){const n=S.dv.getUint32(S.p,!0);S.p+=4;S.names=[];for(let i=0;i<n;i++){const L=S.dv.getUint32(S.p,!0);S.names.push(String.fromCharCode(...S.u8.subarray(S.p+4,S.p+4+L)));S.p+=4+L}}
function node(S){const{dv,u8}=S;let p=S.p;const i=dv.getUint32(p,!0),c=dv.getUint32(p+4,!0),k=u8[p+8];p+=9;
 const o={n:S.names[i]||'',c:[],m:{}};S.p=p;
 if(k===0){for(let j=0;j<c;j++){const x=node(S);o.c.push(x);if(!(x.n in o.m))o.m[x.n]=x}return o}
 let v=null;
 if(k===1)v=!1;else if(k===2)v=!0;else if(k===3){v=u8[p];p++}else if(k===4){v=dv.getUint32(p,!0);p+=4}
 else if(k===5||k===9){v=dv.getFloat64(p,!0);p+=8}
 else if(k===6){const L=dv.getUint32(p,!0);v=TD.decode(u8.subarray(p+4,p+4+2*L));p+=4+2*L}
 else if(k===7){const L=dv.getUint32(p,!0);v=u8.subarray(p+4,p+4+L);p+=4+L}
 else if(k===8)v=null;else throw Error('Неизвестный тип данных '+k+' — файл новее поддерживаемых версий');
 S.p=p;o.v=v;return o}
async function parse(buf){
 const u8=new Uint8Array(buf);
 if(String.fromCharCode(...u8.subarray(0,4))!=='BZ85')throw Error('Это не файл Базис-Мебельщика (нет сигнатуры BZ85).');
 const S={u8,dv:new DataView(buf),p:9};dict(S);const hd=node(S);
 let d=u8.subarray(S.p+5);
 if(u8[S.p+4]===1)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
 const T={u8:d,dv:new DataView(d.buffer,d.byteOffset,d.byteLength),p:0};dict(T);const doc=node(T),a=hd.m.Article;doc.title=a?.m.OrderName?.v||a?.m.Name?.v||'';return doc}

/* ---- геометрия: контур = отрезки (16), дуги (18: центр, начало, конец, направление), точки (17) ---- */
function contour(b){const dv=new DataView(b.buffer,b.byteOffset,b.byteLength),n=dv.getUint32(0,!0),s=[],pts=[];let o=4,ok=!0;
 for(let i=0;i<n&&o<b.length;i++){const t=b[o],f=k=>dv.getFloat64(o+1+8*k,!0);
  if(t===16){s.push({a:[f(0),f(1)],b:[f(2),f(3)]});pts.push([f(0),f(1)],[f(2),f(3)]);o+=33}
  else if(t===18){s.push({c:[f(0),f(1)],a:[f(2),f(3)],b:[f(4),f(5)],cw:b[o+49]===0});pts.push([f(2),f(3)],[f(4),f(5)]);o+=50}
  else if(t===17){pts.push([f(0),f(1)]);ok=!1;o+=25}
  else{ok=!1;break}}
 return pts.length?{s,pts,ok}:null}
function arc(g){const c=g.c,a1=Math.atan2(g.a[1]-c[1],g.a[0]-c[0]),a2=Math.atan2(g.b[1]-c[1],g.b[0]-c[0]),r=Math.hypot(g.a[0]-c[0],g.a[1]-c[1]),T=Math.PI*2,sg=g.cw?-1:1;
 const d=((sg*(a2-a1))%T+T)%T||T,k=Math.max(4,Math.ceil(d/.12)),o=[];
 for(let i=0;i<=k;i++){const t=a1+sg*d*i/k;o.push([c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)])}o[0]=g.a;o[k]=g.b;return o}
function loops(s){const eq=(p,q)=>Math.abs(p[0]-q[0])<1e-3&&Math.abs(p[1]-q[1])<1e-3,u=s.map(()=>0),L=[],pa=g=>g.c?arc(g):[g.a,g.b];
 for(let i0=0;i0<s.length;i0++){if(u[i0])continue;u[i0]=1;const g=s[i0],pts=pa(g).slice(0,-1);let cur=g.b;
  while(!eq(cur,g.a)){let f=-1,rv=!1;for(let i=0;i<s.length&&f<0;i++)if(!u[i]){if(eq(s[i].a,cur))f=i;else if(eq(s[i].b,cur)){f=i;rv=!0}}
   if(f<0)return null;u[f]=1;let q=pa(s[f]);if(rv)q=q.slice().reverse();pts.push(...q.slice(0,-1));cur=q[q.length-1]}
  L.push(pts)}return L}
const area=p=>{let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a)/2};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return'hsl('+h%360+',28%,'+(66+h%14)+'%)'};

function tri(b){const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);let o=0;const k=dv.getUint32(o,!0);o+=4;const out=[];
 for(let i=0;i<k;i++){const L=dv.getUint32(o,!0),name=TD.decode(b.subarray(o+4,o+4+2*L));o+=4+2*L;
  const M=[];for(let j=0;j<16;j++)M.push(dv.getFloat64(o+8*j,!0));o+=129;const n=dv.getUint32(o,!0);o+=4;
  const pos=new Float32Array(n*9),nor=new Float32Array(n*9);
  for(let t=0;t<n;t++){const q=o+112*t;for(let j=0;j<9;j++){pos[t*9+j]=dv.getFloat32(q+4*j,!0);nor[t*9+j]=dv.getFloat32(q+36+4*j,!0)}}
  o+=112*n;out.push({name,M,pos,nor})}
 return o===b.length?out:null}

const mcol=n=>/никел|nikel|нержав|хром|chrom|металл|сталь|steel/i.test(n)?'#b9c0c7':/чёрн|черн|black/i.test(n)?'#33373b':/бел|white/i.test(n)?'#f0f0ec':/сер|gr[ae]y/i.test(n)?'#8c9399':'#a4adb5';
function hw(f,nme){let geo=null;const T=f.m.TriData?.v,g=k=>f.m[k]?.v||0,r=T&&T.length?tri(T):null;
 if(r&&r.length){const p=[],q=[],c=[];for(const s of r){const k=new THREE.Color(mcol(s.name));for(let i=0;i<s.pos.length;i+=3){p.push(s.pos[i],s.pos[i+1],s.pos[i+2]);q.push(s.nor[i],s.nor[i+1],s.nor[i+2]);c.push(k.r,k.g,k.b)}}
  geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(p,3));geo.setAttribute('normal',new THREE.Float32BufferAttribute(q,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(c,3));geo.userData.vc=1}
 else{const sz=['X','Y','Z'].map(a=>g('Max'+a)-g('Min'+a)),o=[0,1,2].sort((a,b)=>sz[b]-sz[a]),L=sz[o[0]],d=Math.min(sz[o[1]],sz[o[2]]),ctr=['X','Y','Z'].map(a=>(g('Min'+a)+g('Max'+a))/2);
  const mm=nme.match(/(\d+(?:[.,]\d+)?)\s*[хx×]\s*(\d+(?:[.,]\d+)?)/i),h=f.m.Holes?.c?.[0]?.m;
  if(L>=2*Math.max(sz[o[1]],sz[o[2]])&&d>=2){geo=new THREE.CylinderGeometry(d/2,d/2,L,14);if(o[0]===0)geo.rotateZ(Math.PI/2);else if(o[0]===2)geo.rotateX(Math.PI/2);geo.translate(...ctr)}
  else if(mm&&h){const w=+mm[1].replace(',','.'),l=+mm[2].replace(',','.'),dv=new THREE.Vector3(h.DirX?.v||0,h.DirY?.v||0,h.DirZ?.v||0);
   if(dv.lengthSq()>0){geo=new THREE.CylinderGeometry(w/2,w/2,l,12);geo.translate(0,l/2,0);geo.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dv.normalize())));geo.translate(h.X?.v||0,h.Y?.v||0,h.Z?.v||0)}}
  else if(L>=10)geo=new THREE.BoxGeometry(sz[0]||1,sz[1]||1,sz[2]||1).translate(...ctr)}
 if(geo){geo.computeBoundingBox();const s=geo.boundingBox.getSize(new THREE.Vector3());geo.userData.dims=[s.x,s.y,s.z].sort((a,b)=>b-a)}
 return geo}

/* ---- сцена ---- */
let R,scene,cam,ctl,dirty=1,root,P=[],BL=[],D=[],S={xray:0,dm:1,iso:null,sel:null},canBack=!1,usr,assets,db,canEdit=!1,mid=null,CM=[],cu,uid=null,pop='',CL=null,unsub;
const flash=t=>{$('#msg').textContent=t;setTimeout(()=>$('#msg').textContent='',4500)};
function shape(c){const L=c.ok&&loops(c.s);if(!L)return null;L.sort((a,b)=>area(b)-area(a));
 const V=p=>p.map(a=>new THREE.Vector2(a[0],a[1])),sh=new THREE.Shape(V(L[0]));L.slice(1).forEach(h=>sh.holes.push(new THREE.Path(V(h))));return sh}
function init(){if(R)return;
 R=new THREE.WebGLRenderer({canvas:$('#cv'),antialias:!0,alpha:!0});R.setPixelRatio(Math.min(devicePixelRatio,2));
 scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(40,1,1,1e5);
 scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,.95));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(1,2,1.5);scene.add(dl);
 ctl=new THREE.OrbitControls(cam,R.domElement);ctl.addEventListener('change',()=>dirty=1);
 new ResizeObserver(()=>{const s=$('#app');R.setSize(s.clientWidth,s.clientHeight,!1);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix();dirty=1}).observe($('#app'));
 (function loop(){requestAnimationFrame(loop);if(dirty){dirty=0;R.render(scene,cam)}})();
 let d0;R.domElement.addEventListener('pointerdown',e=>d0=[e.clientX,e.clientY]);
 R.domElement.addEventListener('pointerup',e=>{if(d0&&Math.hypot(e.clientX-d0[0],e.clientY-d0[1])<6)pick(e)})}
function label(t){const c=document.createElement('canvas');c.width=160;c.height=64;const x=c.getContext('2d');x.fillStyle='rgba(255,255,255,.9)';x.fillRect(0,0,160,64);
 x.fillStyle='#17252f';x.font='bold 40px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,80,34);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:!1}));s.renderOrder=9;return s}
function build(doc){
 if(root){scene.remove(root);root.traverse(o=>o.geometry&&o.geometry.dispose())}
 const fl={};for(const f of(doc.m.FurnList?.c||[]))fl[f.m.FastID?.v]=f;
 root=new THREE.Group();P=[];BL=[];D=[];let n=0;const top={id:0,n:'Модель',a:'',up:null};
 const lm=new THREE.LineBasicMaterial({color:0x2c3b47,transparent:!0,opacity:.5}),HG={};
 const place=(o,src)=>{const T=src.m.Trans;if(!T)return;const g=k=>T.m[k]?T.m[k].v:0;o.position.set(g('X'),g('Y'),g('Z'));o.quaternion.set(g('Rx'),g('Ry'),g('Rz'),g('Rw')).normalize()};
 const add=(p,mesh,o,par,bl)=>{p.id=P.length;p.bl=bl;p.mesh=mesh;p.chain=new Set();for(let b=bl;b;b=b.up)p.chain.add(b.id);mesh.userData.p=p;place(mesh,o);par.add(mesh);P.push(p)};
 const dim=(o,par)=>{const g=k=>o.m[k]?o.m[k].v:0,L=g('Size'),H=g('Length'),c=g('Color'),grp=new THREE.Group();place(grp,o);
  const ln=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([[0,0],[0,H],[L,0],[L,H],[0,H],[L,H]].map(a=>new THREE.Vector3(a[0],a[1],0))),new THREE.LineBasicMaterial({color:'rgb('+[c&255,c>>8&255,c>>16&255]+')',depthTest:!1}));
  ln.renderOrder=8;const sp=label(String(Math.round(g('Value')||L)));sp.position.set(L/2,H,0);grp.add(ln,sp);par.add(grp);D.push(grp)};
 const walk=(o,par,bl,path)=>{const m=o.m,t=m.Type?.v,nm=m.Name?.v||'';
  if(m.Objs){const g=new THREE.Group();place(g,o);par.add(g);const b={id:++n,n:nm,a:m.ArtPos?.v||'',up:bl};BL.push(b);m.Objs.c.forEach(c=>walk(c,g,b,[...path,nm]));return}
  if((t===4002||t===2004)&&m.Contour){const c=contour(m.Contour.v);if(!c)return;const T=m.Thick?.v??m.Thickness?.v??18,th=Math.abs(T)||1;
   const xs=c.pts.map(a=>a[0]),ys=c.pts.map(a=>a[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
   const sh=shape(c)||new THREE.Shape([[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(a=>new THREE.Vector2(a[0],a[1])));
   const geo=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:!1});if(T<0)geo.translate(0,0,-th);geo.computeBoundingBox();const bb=geo.boundingBox;
   const [mat,art]=(m.Mat?.v||'').split('\r'),color=hue(mat||nm),bt={};
   for(const b of(m.Butts?.c||[])){const k=(b.m.Mat?.v||'Кромка')+(b.m.Sign?' ('+b.m.Sign.v+')':'');bt[k]=(bt[k]||0)+1}
   const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,polygonOffset:!0,polygonOffsetFactor:1,polygonOffsetUnits:1}));mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,30),lm));
   const d=[bb.max.x-bb.min.x,bb.max.y-bb.min.y].sort((a,b)=>b-a).concat(th);
   add({k:'p',pos:m.ArtPos?.v||'',name:nm,mat:mat||'',art:art||'',dims:d,color,ckey:[nm,mat,...d.map(Math.round)].join('|'),
    edge:Object.entries(bt).map(([k,v])=>k+' — '+v+' стор.').join('; ')},mesh,o,par,bl)}

    if(!i){i=el('input');i.readOnly=!0;i.style.cssText='flex-basis:100%;font:inherit;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:inherit';li.append(i)}

const TGW=()=>window.Telegram&&window.Telegram.WebApp;
const inTelegram=()=>/tgWebApp/.test(location.hash)||!!window.TelegramWebviewProxy;
const waitSDK=async()=>{if(!inTelegram())return;for(let i=0;i<30&&!TGW();i++)await new Promise(r=>setTimeout(r,50))};
const startParam=()=>{let s='';try{s=TGW()&&TGW().initDataUnsafe&&TGW().initDataUnsafe.start_param||''}catch(e){}
 if(!s){const m=/[#&?]tgWebAppStartParam=([^&]+)/.exec(location.hash+location.search);if(m)try{s=decodeURIComponent(m[1])}catch(e){}}return s};
const FID=/^[A-Za-z0-9_-]{20,250}$/;
async function openTg(fid,name){
 const W=((window.BAZIS||{}).worker||'').replace(/\/+$/,'');
 try{
  if(!W||/ВАШ|YOUR/i.test(W))throw Error('В файле config.js не указан адрес Worker.');
  let r;try{r=await fetch(W+'/f/'+fid)}catch(e){throw Error('Не удалось связаться с сервером моделей. Проверьте интернет и повторите.')}
  if(r.status===404)throw Error('Модель не найдена в Telegram: ссылка неверная или файл удалён.');
  if(r.status===413)throw Error('Файл больше 20 МБ: Telegram не отдаёт такие файлы ботам.');
  if(!r.ok)throw Error('Сервер моделей ответил ошибкой '+r.status+'.');
  await show(await r.arrayBuffer(),canBack,name,null)
 }catch(e){home(e.message)}}

 if(f&&FID.test(f)){$('#app').hidden=!1;$('#msg').textContent='Загружаю модель…';openTg(f,q.get('n')||'')}
 else home(f?'Некорректная ссылка на модель.':'')})();
