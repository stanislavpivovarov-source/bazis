/* ---- разбор контейнера BZ85: словарь имён + дерево узлов, основной блок сжат zlib ---- */

async function parse(buf){

/* ---- геометрия: контур = отрезки (16), дуги (18: центр, начало, конец, направление), точки (17) ---- */

  else{ok=!1;break}}
 return pts.length?{s,pts,ok,cc}:null}
function arc(g){const c=g.c,a1=Math.atan2(g.a[1]-c[1],g.a[0]-c[0]),a2=Math.atan2(g.b[1]-c[1],g.b[0]-c[0]),r=Math.hypot(g.a[0]-c[0],g.a[1]-c[1]),T=Math.PI*2,sg=g.cw?-1:1;
 const d=((sg*(a2-a1))%T+T)%T||T,k=Math.max(4,Math.ceil(d/.12)),o=[];
 for(let i=0;i<=k;i++){const t=a1+sg*d*i/k;o.push([c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)])}o[0]=g.a;o[k]=g.b;return o}
const circPts=k=>Array.from({length:28},(_,i)=>[k.c[0]+k.r*Math.cos(i*Math.PI/14),k.c[1]+k.r*Math.sin(i*Math.PI/14)]);
function loops(s){const eq=(p,q)=>Math.abs(p[0]-q[0])<1e-3&&Math.abs(p[1]-q[1])<1e-3,u=s.map(()=>0),L=[],pa=g=>g.c?arc(g):[g.a,g.b];
 for(let i0=0;i0<s.length;i0++){if(u[i0])continue;u[i0]=1;const g=s[i0],pts=pa(g).slice(0,-1);let cur=g.b;
  while(!eq(cur,g.a)){let f=-1,rv=!1;for(let i=0;i<s.length&&f<0;i++)if(!u[i]){if(eq(s[i].a,cur))f=i;else if(eq(s[i].b,cur)){f=i;rv=!0}}
   if(f<0)return null;u[f]=1;let q=pa(s[f]);if(rv)q=q.slice().reverse();pts.push(...q.slice(0,-1));cur=q[q.length-1]}
  L.push(pts)}return L}
const area=p=>{let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a)/2};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return'hsl('+h%360+',28%,'+(66+h%14)+'%)'};

function tri(b){const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);let o=0;const k=dv.getUint32(o,!0);o+=4;const out=[];
 for(let i=0;i<k;i++){const L=dv.getUint32(o,!0),name=TD.decode(b.subarray(o+4,o+4+2*L));o+=4+2*L;
  const M=[];for(let j=0;j<16;j++)M.push(dv.getFloat64(o+8*j,!0));o+=129;const n=dv.getUint32(o,!0);o+=4;

const mcol=n=>/никел|nikel|нержав|хром|chrom|металл|сталь|steel/i.test(n)?'#b9c0c7':/чёрн|черн|black/i.test(n)?'#33373b':/бел|white/i.test(n)?'#f0f0ec':/сер|gr[ae]y/i.test(n)?'#8c9399':'#a4adb5';

function eccGeo(f,nme){if(!/эксцентр|minifix|rastex/i.test(nme))return null;

    catch(e){x.disabled=!1;x.textContent='Удалить';x.style.cssText='';$('#err').textContent='Не удалось удалить «'+nm+'»: '+(e.message||e.code||e)}};

const TGW=()=>window.Telegram&&window.Telegram.WebApp;
const inTelegram=()=>/tgWebApp/.test(location.hash)||!!window.TelegramWebviewProxy;
const waitSDK=async()=>{if(!inTelegram())return;for(let i=0;i<30&&!TGW();i++)await new Promise(r=>setTimeout(r,50))};
const startParam=()=>{let s='';try{s=TGW()&&TGW().initDataUnsafe&&TGW().initDataUnsafe.start_param||''}catch(e){}
 if(!s){const m=/[#&?]tgWebAppStartParam=([^&]+)/.exec(location.hash+location.search);if(m)try{s=decodeURIComponent(m[1])}catch(e){}}return s};
const OID=/^[0-9a-f]{16}$/;
let ORDER=null;
async function wfetch(path,manifest){
 const w=((window.BAZIS||{}).worker||'').replace(/\/+$/,'');
 if(!w||/ВАШ|YOUR/i.test(w))throw Error('В файле config.js не указан адрес Worker.');
 let r;try{r=await fetch(w+path)}catch(e){throw Error('Не удалось связаться с сервером моделей. Проверьте интернет и повторите.')}
 if(!r.ok){let m='';try{m=(await r.json()).error||''}catch(e){}
  if(r.status===404&&manifest)throw Error('Просмотр не найден: ссылка неверная или его удалили.');
  throw Error((m||'Сервер моделей ответил ошибкой '+r.status)+'.')}
 return r}
function renderOrder(){
 const ol=$('#ol');ol.textContent='';
 $('#h1').textContent=ORDER?ORDER.title:'Просмотр моделей Базис-Мебельщика';
 $('#drop').hidden=!!ORDER;$('#intro').hidden=!!ORDER;ol.hidden=!ORDER;
 if(!ORDER)return;
 document.title=ORDER.title;
 if(!ORDER.files.length){ol.append(el('li','mut','В этом заказе нет файлов моделей.'));return}
 ORDER.files.forEach((f,i)=>{const li=el('li'),bt=el('button','');
  bt.append(el('span','',f.n),el('small','mut',f.z?(f.z>=1e6?(f.z/1e6).toFixed(1)+' МБ':Math.max(1,Math.round(f.z/1e3))+' КБ'):''));
  bt.onclick=()=>{canBack=!0;openFile(i)};li.append(bt);ol.append(li)})}
async function openFile(i){
 const f=ORDER.files[i];
 $('#home').hidden=!0;$('#app').hidden=!1;$('#back').hidden=!canBack;$('#ttl').textContent=ORDER.title;$('#msg').textContent='Загружаю модель…';
 try{const r=await wfetch('/o/'+ORDER.id+'/'+i);await show(await r.arrayBuffer(),canBack,f.n.split('/').pop(),null)}
 catch(e){home(e.message)}}
(async()=>{
 $('#cm').hidden=!0;
 await waitSDK();
 try{const w=TGW();if(w){w.ready();w.expand()}}catch(e){}
 const q=new URLSearchParams(location.search);let o=q.get('o'),mk=q.get('m');
 if(!o){const sp=startParam(),mm=/^([0-9a-f]{16})(?:[_-]([0-9a-f]{8}))?$/.exec(sp);if(mm){o=mm[1];if(mm[2])mk=mm[2]}else o=sp}
 if(!o){home();return}
 if(!OID.test(o)){home('Некорректная ссылка на просмотр.');return}
 $('#app').hidden=!1;$('#msg').textContent='Загружаю…';
 try{
  const m=await(await wfetch('/o/'+o,!0)).json();
  ORDER={id:o,title:m.title||'Модель',files:m.files||[]};
  const n=ORDER.files.length,k=mk?ORDER.files.findIndex(f=>f.k===mk):-1;
  if(k>=0){canBack=n>1;await openFile(k)}                                // ссылка на конкретную модель заказа
  else if(n===1){canBack=!1;await openFile(0)}
  else home(mk?'Этой модели больше нет в заказе. Выберите из списка.':'')
 }catch(e){home(e.message)}})();
